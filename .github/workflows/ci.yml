name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  quality-and-build:
    name: quality-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate development environment
        run: pnpm run doctor

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests with coverage
        run: pnpm test:coverage

      - name: Build applications
        run: pnpm build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  db-cloud:
    name: db-cloud
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cloud database isolation tests
        run: pnpm test:db-cloud
        env:
          # Disposable embedded Postgres applies canonical supabase/migrations.
          # Avoids Docker-in-CI flakiness while still exercising restricted-role RLS.
          POLIVO_CLOUD_TEST_FORCE_EMBEDDED: "1"

  web-e2e:
    name: web-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Clerk development keys (not production). Required for next start + SignIn UI e2e.
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      IS_FORK_PR: ${{ github.event.pull_request.head.repo.fork == true }}
      IS_DEPENDABOT: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Build web application and workspace dependencies
        run: pnpm --filter @polivo/web... build

      - name: Run web end-to-end tests
        run: |
          if [ -z "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}" ] || [ -z "${CLERK_SECRET_KEY}" ]; then
            if [ "${IS_FORK_PR}" = "true" ] || [ "${IS_DEPENDABOT}" = "true" ]; then
              echo "::notice::Skipping Clerk-backed web-e2e (secrets unavailable for fork PR or Dependabot)."
              echo "See docs/operations/testing-and-ci.md."
              exit 0
            fi
            echo "::error::Missing Clerk development secrets for web-e2e."
            echo "Add repository secrets NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY and CLERK_SECRET_KEY"
            echo "(Clerk development instance keys — not production)."
            echo "See docs/operations/testing-and-ci.md."
            exit 1
          fi
          pnpm exec playwright test --config=tests/e2e/web/playwright.config.ts

      - name: Upload web e2e diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-e2e-diagnostics
          path: |
            test-results/web/
            playwright-report/web/
          retention-days: 7
          if-no-files-found: ignore

  desktop-smoke:
    name: desktop-smoke
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop application and workspace dependencies
        run: pnpm --filter @polivo/desktop... build

      - name: Run desktop Electron smoke test
        run: pnpm exec playwright test --config=tests/e2e/desktop/playwright.config.ts

      - name: Upload desktop smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-smoke-diagnostics
          path: |
            test-results/desktop/
            playwright-report/desktop/
          retention-days: 7
          if-no-files-found: ignore
